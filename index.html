<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PileCap Level Management</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --container-bg: #fff;
            --text-color: #333;
            --border-color: #ddd;
            --th-bg: #343a40;
            --input-bg: #fff;
            --input-text: #333;
        }

        .dark-mode {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --border-color: #444;
            --th-bg: #2c3034;
            --input-bg: #2d2d2d;
            --input-text: #fff;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2px;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            max-width: 100%;
            margin: 0;
            background: var(--container-bg);
            padding: 4px;
            border-radius: 0;
            box-shadow: none;
            transition: background 0.3s;
        }

        #formView {
            padding-bottom: 150px;
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .logo-title-box {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .app-logo {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #007bff;
            border-radius: 6px;
            color: white;
            padding: 4px;
        }

        .app-logo svg {
            width: 100%;
            height: 100%;
            fill: currentColor;
        }

        h2, h3 {
            text-align: center;
            color: var(--text-color);
            margin: 3px 0;
            font-size: 18px;
        }

        .theme-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            width: auto;
            margin: 0;
        }

        input, select, button {
            width: 100%;
            padding: 8px;
            margin: 4px 0;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--input-text);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 13px;
        }

        label {
            font-weight: bold;
            font-size: 12px;
            color: var(--text-color);
            display: block;
            margin-top: 6px;
        }

        .counter-box {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }

        .counter-card {
            flex: 1;
            padding: 6px;
            border-radius: 4px;
            text-align: center;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            font-size: 12px;
        }

        .counter-card:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .card-complete { background-color: #28a745; }
        .card-pending { background-color: #e0a800; }
        .card-total { background-color: #17a2b8; }

        .counter-card span {
            display: block;
            font-size: 15px;
            margin-top: 2px;
        }

        .action-main-btns {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }

        .add-btn {
            background-color: #007bff;
            color: white;
            font-size: 14px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin: 0;
            flex: 2;
        }
        .add-btn:hover { background-color: #0056b3; }

        .excel-btn {
            background-color: #198754;
            color: white;
            font-size: 13px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin: 0;
            flex: 1;
        }
        .excel-btn:hover { background-color: #146c43; }

        .reset-btn {
            background-color: #dc3545;
            color: white;
            font-size: 13px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin: 0;
            flex: 1;
        }
        .reset-btn:hover { background-color: #b02a37; }

        .save-btn {
            background-color: #28a745;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
        .save-btn:hover { background-color: #218838; }

        .delete-form-btn {
            background-color: #dc3545;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        .delete-form-btn:hover { background-color: #c82333; }

        .back-btn {
            background-color: #6c757d;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        .back-btn:hover { background-color: #5a6268; }

        .search-box {
            margin-bottom: 8px;
        }

        .table-box {
            overflow-x: auto;
            margin-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 5px 3px;
            text-align: left;
            font-size: 11px;
            color: var(--text-color);
        }

        th {
            background-color: var(--th-bg);
            color: white;
        }

        .complete-header {
            background-color: #28a745 !important;
        }

        .action-btns {
            display: flex;
            gap: 2px;
            justify-content: center;
        }

        .icon-edit-btn {
            background-color: #ffc107;
            color: black;
            border: none;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }
        .icon-edit-btn:hover { background-color: #d39e00; }

        .search-result-card {
            background: #ffffff !important;
            border: 3px solid #087cff;
            border-radius: 14px;
            padding: 14px;
            margin: 8px 0 14px;
            box-shadow: 0 3px 12px rgba(0,0,0,.18);
        }
        .search-result-title {
            font-size: 25px;
            font-weight: 900;
            margin: 2px 8px 14px;
            color: #0875d9 !important;
            letter-spacing: .2px;
        }
        .search-result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .search-result-field {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 104px;
            box-sizing: border-box;
            border: 2px solid #d9d9d9;
            border-radius: 12px;
            padding: 12px 14px;
            background: #fff;
            box-shadow: 0 1px 4px rgba(0,0,0,.10);
        }
        .search-result-icon {
            flex: 0 0 64px;
            width: 64px;
            height: 64px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 34px;
            font-weight: 900;
            line-height: 1;
            text-shadow: 0 1px 2px rgba(0,0,0,.22);
        }
        .search-result-content { min-width: 0; flex: 1; }
        .search-result-label {
            display: block;
            font-size: 16px !important;
            line-height: 1.15;
            font-weight: 500 !important;
            color: #111 !important;
            margin: 0 0 6px;
        }
        .search-result-value {
            display: block;
            font-size: 26px !important;
            line-height: 1.08;
            font-weight: 900 !important;
            color: #111 !important;
            word-break: break-word;
        }
        .search-result-field:nth-child(1) .search-result-icon { background:#1687ff; }
        .search-result-field:nth-child(2) .search-result-icon { background:#12b52a; }
        .search-result-field:nth-child(3) .search-result-icon { background:#6330d6; }
        .search-result-field:nth-child(4) .search-result-icon { background:#e51d6d; }
        .search-result-field:nth-child(5) .search-result-icon { background:#ff9f00; }
        .search-result-field:nth-child(6) .search-result-icon { background:#20a8ff; }

        .search-result-actions {
            display: flex;
            gap: 12px;
            margin-top: 14px;
        }
        .search-result-actions button {
            margin: 0;
            flex: 1;
            min-height: 58px;
            padding: 10px;
            font-size: 20px;
            font-weight: 900;
            border-radius: 10px;
            border: none;
        }
        .search-result-actions .icon-edit-btn { background:#ffad00 !important; color:#111 !important; }
        .search-empty {
            padding: 18px; text-align:center; font-size:16px; font-weight:bold;
            border:1px solid #ccc; border-radius:8px; margin:8px 0;
        }
        @media (max-width:600px){
            .search-result-card{padding:12px;border-radius:14px;}
            .search-result-title{font-size:24px;margin:2px 6px 12px;}
            .search-result-grid{gap:10px;}
            .search-result-field{min-height:92px;padding:10px;gap:10px;}
            .search-result-icon{flex-basis:52px;width:52px;height:52px;font-size:28px;border-radius:10px;}
            .search-result-label{font-size:15px !important;}
            .search-result-value{font-size:23px !important;}
            .search-result-actions{gap:10px;}
            .search-result-actions button{min-height:56px;font-size:19px;}
        }

        .section-title {
            font-size: 13px;
            margin: 8px 0 4px 0;
            color: var(--text-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 2px;
        }

        /* Clean Settings Panel */
        .settings-btn { background:#343a40; color:#fff; border:none; width:auto; margin:0; padding:7px 10px; border-radius:8px; font-size:14px; font-weight:bold; cursor:pointer; }
        .settings-panel { display:none; margin:6px 0 10px; border:1px solid var(--border-color); border-radius:12px; background:var(--container-bg); box-shadow:0 4px 16px rgba(0,0,0,.12); overflow:hidden; }
        .settings-panel.open { display:block; }
        .settings-head { display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border-bottom:1px solid var(--border-color); }
        .settings-head strong { font-size:16px; }
        .settings-close { width:auto; margin:0; padding:3px 9px; background:none; border:1px solid var(--border-color); color:var(--text-color); }
        .settings-user { padding:10px 12px; background:rgba(127,127,127,.08); }
        .settings-user-name { font-weight:800; font-size:15px; }
        .settings-user-email { font-size:12px; opacity:.8; margin-top:2px; }
        .settings-actions { display:grid; grid-template-columns:1fr 1fr; gap:7px; padding:10px 12px; }
        .settings-action { margin:0; padding:9px 8px; border:none; border-radius:8px; color:#fff; font-weight:bold; font-size:12px; cursor:pointer; }
        .settings-input { background:#007bff; }
        .settings-excel { background:#198754; }
        .settings-reset { background:#dc3545; }
        .settings-dark { background:#343a40; }
        .settings-logout { background:#dc3545; }
        .settings-users { background:#6f42c1; }
        .settings-admin-box { display:none; border-top:1px solid var(--border-color); padding:10px 12px; }
        .settings-admin-box.open { display:block; }
        .settings-admin-title { font-weight:800; font-size:14px; margin-bottom:7px; }
        .settings-admin-list { border:1px solid var(--border-color); border-radius:8px; padding:7px; }
        .settings-admin-list .user-row { grid-template-columns:1fr 1.4fr .7fr 1.2fr; }
        @media(max-width:600px){ .settings-actions{grid-template-columns:1fr 1fr;} .settings-admin-list .user-row{grid-template-columns:1fr 1fr;} }

        /* Firebase Authentication */
        #authView { min-height: 90vh; display:flex; align-items:center; justify-content:center; }
        .auth-card { width:min(420px, 94vw); padding:20px; border:1px solid var(--border-color); border-radius:12px; background:var(--container-bg); box-shadow:0 4px 18px rgba(0,0,0,.12); }
        .auth-card h2 { font-size:22px; margin-bottom:14px; }
        .auth-tabs { display:flex; gap:6px; margin-bottom:12px; }
        .auth-tabs button { margin:0; font-weight:bold; }
        .auth-tabs .active { background:#007bff; color:#fff; }
        .auth-primary { background:#007bff; color:#fff; border:none; font-weight:bold; }
        .auth-danger { background:#dc3545; color:#fff; border:none; font-weight:bold; }
        .auth-message { min-height:20px; font-size:12px; font-weight:bold; margin:6px 0; text-align:center; }
        .user-bar { display:flex; gap:6px; align-items:center; justify-content:flex-end; margin-bottom:6px; font-size:11px; }
        .role-badge { padding:3px 7px; border-radius:10px; background:#6f42c1; color:#fff; font-weight:bold; }
        .hidden-by-role { display:none !important; }
        .hidden-by-role { display:none !important; }
        .top-actions { display:flex; gap:6px; align-items:center; justify-content:flex-end; }
        .admin-page-btn { background:#6f42c1; color:#fff; border:none; font-weight:bold; padding:5px 9px; border-radius:4px; cursor:pointer; width:auto; margin:0; }
        .admin-page-btn:hover { background:#56339a; }
        .user-bar .logout-top { background:#dc3545; color:#fff; border:none; font-weight:bold; }
        #adminView { display:none; padding-bottom:120px; }
        .admin-head { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:4px 0 10px; }
        .admin-head h3 { margin:0; text-align:left; }
        .admin-back { width:auto; margin:0; background:#6c757d; color:#fff; border:none; font-weight:bold; }
        .user-list-card { border:1px solid var(--border-color); border-radius:8px; padding:8px; margin:8px 0; background:var(--container-bg); }
        .user-row { display:grid; grid-template-columns: 1.4fr 1.8fr .8fr 1.1fr; gap:6px; align-items:center; padding:7px 0; border-bottom:1px solid var(--border-color); font-size:12px; }
        .user-row:last-child { border-bottom:none; }
        .user-role { font-weight:bold; padding:3px 6px; border-radius:10px; background:#6f42c1; color:#fff; text-align:center; }
        .user-actions { display:flex; gap:4px; }
        .user-actions button { width:auto; margin:0; padding:5px 7px; font-size:11px; }
        .user-reset { background:#0d6efd; color:#fff; border:none; }
        .user-role-btn { background:#ffc107; color:#111; border:none; }
        .user-delete { background:#dc3545; color:#fff; border:none; }
        @media(max-width:600px){ .user-row{grid-template-columns:1fr 1fr;} .user-actions{grid-column:1/-1;} .top-actions{gap:4px;} }

    </style>

    <!-- Firebase -->

            getFirestore, collection, doc, getDoc, getDocs, setDoc, query, where,
            addDoc, updateDoc, deleteDoc, writeBatch
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

        // ============================================================

            apiKey: "AIzaSyAMvPr5LoxK5HLw4PuvzH_eMkPEXMz_OjI",
            authDomain: "shop-20145.firebaseapp.com",
            projectId: "shop-20145",
            storageBucket: "shop-20145.firebasestorage.app",
            messagingSenderId: "131074777637",
            appId: "1:131074777637:web:6792dc8129c206b16dd5cc",

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.firebaseApp = app;

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body id="pageBody">
    <!-- Firebase Auth + Firestore enabled. Configure firebaseConfig above. -->

    <div class="container">
        <div class="header-flex">
            <div class="logo-title-box">
                <div class="app-logo">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2C9.24 2 7 4.24 7 7v1H5c-1.1 0-2 .9-2 2v2c0 1.1.9 2 2 2h2v1c0 2.76 2.24 5 5 5s5-2.24 5-5v-1h2c1.1 0 2-.9 2-2v-2c0-1.1-.9-2-2-2h-2V7c0-2.76-2.24-5-5-5zm0 2c1.66 0 3 1.34 3 3v1H9V7c0-1.66 1.34-3 3-3zm5 9H7v-2h10v2zm-5 7c-1.66 0-3-1.34-3-3v-1h6v1c0 1.66-1.34 3-3 3z"/>
                    </svg>
                </div>
                <h2>PileCap Lavel</h2>
            </div>
            <div class="top-actions">
                <button class="settings-btn" onclick="toggleSettings()" id="settingsBtn">⚙ Settings</button>
            </div>
        </div>


        <!-- Firebase Login / Register -->
        <div id="authView">
            <div class="auth-card">
                <h2>PileCap Lavel</h2>
                <div class="auth-tabs">
                    <button id="loginTab" class="active" onclick="showAuthMode('login')">Login</button>
                    <button id="registerTab" onclick="showAuthMode('register')">Register</button>
                </div>
                <input type="text" id="authName" placeholder="Name (for Register)" autocomplete="name" style="display:none;">
                <input type="email" id="authEmail" placeholder="Email address" autocomplete="email">
                <input type="password" id="authPassword" placeholder="Password (minimum 6 characters)" autocomplete="current-password">
                <input type="password" id="authPassword2" placeholder="Confirm password" autocomplete="new-password" style="display:none;">
                <button id="authSubmit" class="auth-primary" onclick="submitAuth()">Login</button>
                <button type="button" id="forgotPasswordBtn" style="background:none;border:none;color:#007bff;font-weight:bold;font-size:12px;" onclick="resetPassword()">Forgot Password?</button>
                <button id="authLogout" class="auth-danger" onclick="logoutFirebase()" style="display:none;">Logout</button>
                <div id="authMessage" class="auth-message"></div>
            </div>
        </div>

        <div id="appShell" style="display:none;">
            <div class="user-bar"><span id="currentUserName"></span><span id="currentUserEmail"></span><span id="roleBadge" class="role-badge"></span></div>

            <div id="settingsPanel" class="settings-panel">
                <div class="settings-head"><strong>Settings & Management</strong><button class="settings-close" onclick="toggleSettings(false)">✕</button></div>
                <div class="settings-user">
                    <div class="settings-user-name" id="settingsUserName">User</div>
                    <div class="settings-user-email" id="settingsUserEmail"></div>
                </div>
                <div class="settings-actions">
                    <button id="settingsInputBtn" class="settings-action settings-input hidden-by-role" onclick="toggleSettings(false);openAddForm()">➕ New Input</button>
                    <button id="settingsExcelBtn" class="settings-action settings-excel hidden-by-role" onclick="document.getElementById('excelInput').click()">📊 Import Excel</button>
                    <button id="settingsResetBtn" class="settings-action settings-reset hidden-by-role" onclick="resetAllData()">🗑 Reset Data</button>
                    <button class="settings-action settings-dark" onclick="toggleTheme()" id="themeToggleBtn">🌙 Dark Mode</button>
                    <button id="settingsUsersBtn" class="settings-action settings-users hidden-by-role" onclick="toggleAdminPanel()">👥 User List</button>
                    <button class="settings-action settings-logout" onclick="logoutFirebase()">🚪 Logout</button>
                </div>
                <input type="file" id="excelInput" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv" style="display:none" onchange="importFromExcel(event)">
                <div id="settingsAdminBox" class="settings-admin-box">
                    <div class="settings-admin-title">👑 Admin Panel — User Management</div>
                    <div class="settings-admin-list"><div id="userListContainer"></div></div>
                </div>
            </div>

        <!-- Home Page -->
        <div id="homeView">


            <!-- Status Counters -->
            <div class="counter-box">
                <div class="counter-card card-total" onclick="filterByStatus('All')">
                    Total Pilecap
                    <span id="totalCount">0</span>
                </div>
                <div class="counter-card card-complete" onclick="filterByStatus('Complete')">
                    Complete
                    <span id="completeCount">0</span>
                </div>
                <div class="counter-card card-pending" onclick="filterByStatus('Pending')">
                    Pending
                    <span id="pendingCount">0</span>
                </div>
                <div class="counter-card" style="background-color:#fd7e14;" onclick="filterByStatus('Processing')">
                    Processing
                    <span id="processingCount">0</span>
                </div>
                <div class="counter-card" style="background-color:#6f42c1;" onclick="filterByStatus('Hold')">
                    Hold
                    <span id="holdCount">0</span>
                </div>
            </div>

            <!-- Search Box -->
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search Serial / No. (e.g., PG011)..." onkeyup="searchData()">
            </div>

            <div class="search-box">
                <select id="serialSelect" onchange="selectSerialData(this.value)">
                    <option value="">Select Serial / No...</option>
                </select>
            </div>

            <!-- Large exact-serial search result -->
            <div id="searchResultCard" style="display:none;"></div>

            <!-- Search Results / Main Lists -->
            <div id="resultContainer" style="display: none;"></div>
        </div>

        <!-- Admin User Management Page -->
        <div id="adminView" style="display:none !important;">
            <div class="admin-head">
                <h3>User Management</h3>
                <button class="admin-back" onclick="closeAdminPage()">Back to Home</button>
            </div>
            <div class="user-list-card">
                <div style="font-weight:bold;margin-bottom:6px;">Registered Users</div>
                <div id="userListContainer"></div>
            </div>
        </div>

        <!-- Data Entry and Edit Form -->
        <div id="formView" style="display: none;">
            <h3 id="formTitle">New Pile Cap Level Entry</h3>
            <div class="form-box">
                <input type="hidden" id="editId"> 
                
                <label>Serial / No:</label>
                <input type="text" id="serial" placeholder="Enter Serial / No (e.g., PG011)" autocomplete="off">

                <label>Zone:</label>
                <input type="text" id="zone" placeholder="Enter Zone (e.g., Zone A)" onfocus="scrollToElement(this)">
                
                <label>FFL:</label>
                <input type="text" id="ffl" placeholder="Enter FFL level..." onfocus="scrollToElement(this)">
                
                <label>TOPC:</label>
                <input type="text" id="topc" placeholder="Enter TOPC level..." onfocus="scrollToElement(this)">
                
                <label>PCOL (Pilecap Level):</label>
                <input type="text" id="pcol" placeholder="Enter Pilecap level..." onfocus="scrollToElement(this)">

                <label>Remarks / Notes:</label>
                <input type="text" id="remarks" placeholder="Enter any issues or special notes..." onfocus="scrollToElement(this)">

                <label>Status:</label>
                <select id="status" onfocus="scrollToElement(this)">
                    <option value="Pending">Pending</option>
                    <option value="Processing">Processing</option>
                    <option value="Hold">Hold</option>
                    <option value="Complete">Complete</option>
                </select>
                
                <button class="save-btn" onclick="saveData()">Save / Update</button>
                <button id="deleteBtnInForm" class="delete-form-btn" style="display:none;" onclick="deleteCurrentData()">Delete This Data</button>
                <button class="back-btn" onclick="goHome()">Go Back</button>
            </div>
        </div>
        </div>

    </div>

    <script>
        let dataList = [];
        let currentUser = null;
        let currentRole = 'user';
        let authMode = 'login';
        let firebaseInitialized = false;
        const SUPER_ADMIN_EMAIL = 'sattar124@gmail.com';

        function setAuthMessage(msg, error=false) {
            const el = document.getElementById('authMessage');
            if (el) { el.innerText = msg || ''; el.style.color = error ? '#dc3545' : '#198754'; }
        }

        function showAuthMode(mode) {
            authMode = mode;
            document.getElementById('loginTab').classList.toggle('active', mode === 'login');
            document.getElementById('registerTab').classList.toggle('active', mode === 'register');
            document.getElementById('authSubmit').innerText = mode === 'login' ? 'Login' : 'Register';
            document.getElementById('authPassword2').style.display = mode === 'register' ? 'block' : 'none';
            document.getElementById('authName').style.display = mode === 'register' ? 'block' : 'none';
            setAuthMessage('');
        }

        async function submitAuth() {
            if (!firebaseInitialized) return setAuthMessage('Firebase is not configured yet.', true);
            const name = document.getElementById('authName').value.trim();
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value;
            const password2 = document.getElementById('authPassword2').value;
            if (!email || !password) return setAuthMessage('Enter email and password.', true);
            if (authMode === 'register' && !name) return setAuthMessage('Enter your name.', true);
            if (authMode === 'register' && password !== password2) return setAuthMessage('Passwords do not match.', true);
            try {
                const f = window.firebaseFns;
                if (authMode === 'login') {
                    await f.signInWithEmailAndPassword(window.firebaseAuth, email, password);
                } else {
                    const cred = await f.createUserWithEmailAndPassword(window.firebaseAuth, email, password);
                    await f.updateProfile(cred.user, { displayName: name });
                    const profileData = { name, displayName: name, email, role: 'user', createdAt: Date.now() };
                    await f.setDoc(f.doc(window.firebaseDB, 'user', cred.user.uid), profileData);
                    await f.setDoc(f.doc(window.firebaseDB, 'users', cred.user.uid), profileData);
                }
                setAuthMessage('');
            } catch (err) {
                setAuthMessage(err.message.replace('Firebase: ', ''), true);
            }
        }

        async function resetPassword() {
            if (!firebaseInitialized) return setAuthMessage('Firebase is not configured yet.', true);
            const email = document.getElementById('authEmail').value.trim();
            if (!email) {
                return setAuthMessage('First enter your email address, then tap Forgot Password.', true);
            }

            try {
                await window.firebaseFns.sendPasswordResetEmail(window.firebaseAuth, email);
                setAuthMessage('Password reset email sent. Check your email inbox/spam folder.');
            } catch (err) {
                let msg = err.message.replace('Firebase: ', '');
                if (err.code === 'auth/user-not-found') msg = 'No account found with this email.';
                if (err.code === 'auth/invalid-email') msg = 'Please enter a valid email address.';
                setAuthMessage(msg, true);
            }
        }

        async function logoutFirebase() {
            if (!window.firebaseAuth) return;
            await window.firebaseFns.signOut(window.firebaseAuth);
        }

        async function loadFirebaseData() {
            const f = window.firebaseFns;
            const snap = await f.getDocs(f.collection(window.firebaseDB, 'pilecaps'));
            dataList = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            updateCounters();
            populateSerialDropdown();
        }

        function roleIsAdmin() { return currentRole === 'admin'; }

        function applyRoleUI() {
            const admin = roleIsAdmin();
            ['settingsInputBtn','settingsExcelBtn','settingsResetBtn','settingsUsersBtn'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.toggle('hidden-by-role', !admin);
            });
            document.querySelectorAll('.icon-edit-btn, .delete-form-btn').forEach(el => {
                el.classList.toggle('hidden-by-role', !admin);
            });
        }

        async function handleFirebaseAuth(user) {
            currentUser = user;
            const authView = document.getElementById('authView');
            const appShell = document.getElementById('appShell');

            if (!user) {
                currentRole = 'user';
                authView.style.display = 'flex';
                appShell.style.display = 'none';
                dataList = [];
                return;
            }

            const f = window.firebaseFns;
            const loginEmail = String(user.email || '').trim().toLowerCase();

            // Permanent Super Admin
            let role = loginEmail === SUPER_ADMIN_EMAIL ? 'admin' : 'user';

            // Your Firestore screenshot uses `user` (singular).
            // The app may also have `users`, so support both.
            const userCollections = ['user', 'users'];

            for (const collectionName of userCollections) {
                if (role === 'admin') break;

                // 1) Auth UID as document ID
                try {
                    const uidDoc = await f.getDoc(f.doc(window.firebaseDB, collectionName, user.uid));
                    if (uidDoc.exists()) {
                        const d = uidDoc.data() || {};
                        if (String(d.role || '').trim().toLowerCase() === 'admin' ||
                            String(d.profile?.role || '').trim().toLowerCase() === 'admin') {
                            role = 'admin';
                            break;
                        }
                    }
                } catch (e) { console.warn('UID role lookup failed:', collectionName, e); }

                // 2) email field
                if (loginEmail) {
                    try {
                        const q = f.query(
                            f.collection(window.firebaseDB, collectionName),
                            f.where('email', '==', user.email)
                        );
                        const snap = await f.getDocs(q);
                        for (const ds of snap.docs) {
                            const d = ds.data() || {};
                            if (String(d.role || '').trim().toLowerCase() === 'admin' ||
                                String(d.profile?.role || '').trim().toLowerCase() === 'admin') {
                                role = 'admin';
                                break;
                            }
                        }
                    } catch (e) { console.warn('email role lookup failed:', collectionName, e); }
                }

                // 3) profile.email field
                if (role !== 'admin' && loginEmail) {
                    try {
                        const q = f.query(
                            f.collection(window.firebaseDB, collectionName),
                            f.where('profile.email', '==', user.email)
                        );
                        const snap = await f.getDocs(q);
                        for (const ds of snap.docs) {
                            const d = ds.data() || {};
                            if (String(d.role || '').trim().toLowerCase() === 'admin' ||
                                String(d.profile?.role || '').trim().toLowerCase() === 'admin') {
                                role = 'admin';
                                break;
                            }
                        }
                    } catch (e) { console.warn('profile.email role lookup failed:', collectionName, e); }
                }
            }

            currentRole = role;
            document.getElementById('currentUserEmail').innerText = user.email || '';
            document.getElementById('currentUserName').innerText = user.displayName ? (user.displayName + ' •') : '';
            document.getElementById('roleBadge').innerText = currentRole.toUpperCase();
            document.getElementById('settingsUserName').innerText = user.displayName || 'User';
            document.getElementById('settingsUserEmail').innerText = (user.email || '') + ' • ' + currentRole.toUpperCase();

            authView.style.display = 'none';
            appShell.style.display = 'block';

            await loadFirebaseData();
            applyRoleUI();
            closeAdminPage();
        }

        function initializeFirebaseUI() {
            if (firebaseInitialized || !window.firebaseAuth || !window.firebaseFns) return;
            firebaseInitialized = true;
            window.firebaseFns.onAuthStateChanged(window.firebaseAuth, handleFirebaseAuth);
        }
        window.addEventListener('firebase-ready', initializeFirebaseUI);
        if (window.firebaseReady) initializeFirebaseUI();



        // ============================
        // Admin User Management
        // ============================
        function toggleSettings(force) {
            const panel = document.getElementById('settingsPanel');
            const open = typeof force === 'boolean' ? force : !panel.classList.contains('open');
            panel.classList.toggle('open', open);
            if (open && currentUser) {
                document.getElementById('settingsUserName').innerText = currentUser.displayName || 'User';
                document.getElementById('settingsUserEmail').innerText = (currentUser.email || '') + ' • ' + currentRole.toUpperCase();
            }
        }

        async function toggleAdminPanel() {
            if (!roleIsAdmin()) return alert('Only Admin can view the user list.');
            const box = document.getElementById('settingsAdminBox');
            const open = box.classList.toggle('open');
            if (open) await loadUserList();
        }

        async function openAdminPage() {
            if (!roleIsAdmin()) return alert('Only Admin can view the user list.');
            toggleSettings(true);
            const box = document.getElementById('settingsAdminBox');
            box.classList.add('open');
            await loadUserList();
        }

        function closeAdminPage() {
            const box = document.getElementById('settingsAdminBox');
            if (box) box.classList.remove('open');
        }

        async function loadUserList() {
            if (!roleIsAdmin()) return;
            const box = document.getElementById('userListContainer');
            box.innerHTML = '<div style="padding:10px;text-align:center;">Loading users...</div>';
            try {
                const f = window.firebaseFns;
                const byUid = new Map();
                for (const collectionName of ['users']) {
                    const snap = await f.getDocs(f.collection(window.firebaseDB, collectionName));
                    snap.docs.forEach(ds => {
                        const d = ds.data() || {};
                        const key = ds.id || d.email || Math.random();
                        const old = byUid.get(key) || {};
                        byUid.set(key, {...old, ...d, uid: ds.id});
                    });
                }

                const users = Array.from(byUid.values()).filter(u => u.email);
                users.sort((a,b) => String(a.email).localeCompare(String(b.email)));

                if (!users.length) {
                    box.innerHTML = '<div style="padding:10px;text-align:center;">No users found.</div>';
                    return;
                }

                box.innerHTML = users.map(u => {
                    const email = escapeHtml(u.email || '-');
                    const name = escapeHtml(u.name || u.displayName || u.email || 'User');
                    const role = String(u.role || 'user').toLowerCase() === 'admin' ? 'admin' : 'user';
                    const isSuper = String(u.email).toLowerCase() === SUPER_ADMIN_EMAIL.toLowerCase();
                    return `
                        <div class="user-row">
                            <div><b>${name}</b></div>
                            <div>${email}</div>
                            <div><span class="user-role">${role.toUpperCase()}</span></div>
                            <div class="user-actions">
                                <button class="user-reset" onclick="adminResetUser('${escapeJs(u.email)}')">Reset</button>
                                ${isSuper ? '<span style="font-size:10px;font-weight:bold;">Super Admin</span>' : `
                                    <button class="user-role-btn" onclick="adminToggleRole('${escapeJs(u.uid)}','${escapeJs(u.email)}','${role}')">${role === 'admin' ? 'Make User' : 'Make Admin'}</button>
                                    <button class="user-delete" onclick="adminDeleteUser('${escapeJs(u.uid)}','${escapeJs(u.email)}')">Delete</button>
                                `}
                            </div>
                        </div>`;
                }).join('');
            } catch (err) {
                console.error(err);
                box.innerHTML = '<div style="padding:10px;color:#dc3545;text-align:center;">Cannot load user list. Check Firestore rules.</div>';
            }
        }

        function escapeJs(v) {
            return String(v ?? '').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r?\n/g,' ');
        }

        async function adminResetUser(email) {
            if (!roleIsAdmin()) return alert('Only Admin can manage users.');
            try {
                await window.firebaseFns.sendPasswordResetEmail(window.firebaseAuth, email);
                alert('Password reset email sent to ' + email);
            } catch (err) {
                alert('Reset failed: ' + err.message.replace('Firebase: ', ''));
            }
        }

        async function adminToggleRole(uid, email, currentRole) {
            if (!roleIsAdmin()) return alert('Only Admin can manage users.');
            if (String(email).toLowerCase() === SUPER_ADMIN_EMAIL.toLowerCase()) return alert('Super Admin role cannot be changed.');
            const newRole = currentRole === 'admin' ? 'user' : 'admin';
            if (!confirm(`Change ${email} role to ${newRole.toUpperCase()}?`)) return;
            try {
                const f = window.firebaseFns;
                // Keep both possible profile collections synchronized.
                for (const collectionName of ['users']) {
                    await f.setDoc(f.doc(window.firebaseDB, collectionName, uid), {
                        email, role: newRole, updatedAt: Date.now()
                    }, {merge:true});
                }
                await loadUserList();
            } catch (err) {
                alert('Role update failed: ' + err.message);
            }
        }

        async function adminDeleteUser(uid, email) {
            if (!roleIsAdmin()) return alert('Only Admin can manage users.');
            if (String(email).toLowerCase() === SUPER_ADMIN_EMAIL.toLowerCase()) return alert('Super Admin cannot be deleted.');
            if (!confirm(`Delete profile for ${email}? This removes the user profile from the app database. The Firebase Authentication account itself must be deleted from Firebase Console/Admin SDK.`)) return;
            try {
                const f = window.firebaseFns;
                for (const collectionName of ['users']) {
                    try { await f.deleteDoc(f.doc(window.firebaseDB, collectionName, uid)); } catch(e) {}
                }
                await loadUserList();
            } catch (err) {
                alert('Delete failed: ' + err.message);
            }
        }

        window.onload = function() {
            updateCounters();
            populateSerialDropdown();
            
            const savedTheme = localStorage.getItem('siteTheme');
            if(savedTheme === 'dark') {
                document.getElementById('pageBody').classList.add('dark-mode');
                document.getElementById('themeToggleBtn').innerText = '☀️ Light Mode';
            }
        };

        function scrollToElement(element) {
            setTimeout(() => {
                element.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 300);
        }

        function toggleTheme() {
            const body = document.getElementById('pageBody');
            body.classList.toggle('dark-mode');
            const btn = document.getElementById('themeToggleBtn');
            if(body.classList.contains('dark-mode')) {
                localStorage.setItem('siteTheme', 'dark');
                btn.innerText = '☀️ Light Mode';
            } else {
                localStorage.setItem('siteTheme', 'light');
                btn.innerText = '🌙 Dark Mode';
            }
        }

        function openAddForm() {
            document.getElementById('formTitle').innerText = "New Pile Cap Level Entry";
            document.getElementById('editId').value = '';
            document.getElementById('deleteBtnInForm').style.display = 'none'; 
            clearForm();

            document.getElementById('homeView').style.display = 'none';
            document.getElementById('formView').style.display = 'block';
            window.scrollTo(0, 0);
        }

        function goHome() {
            document.getElementById('adminView').style.display = 'none';
            document.getElementById('homeView').style.display = 'block';
            document.getElementById('formView').style.display = 'none';
            clearForm();
            document.getElementById('searchInput').value = '';
            document.getElementById('serialSelect').value = '';
            document.getElementById('resultContainer').style.display = 'none';
            updateCounters();
            window.scrollTo(0, 0);
        }

        async function saveData() {
            if (!roleIsAdmin()) return alert('Only Admin can modify data.');
            const editId = document.getElementById('editId').value;
            const serial = document.getElementById('serial').value.trim();
            const zone = document.getElementById('zone').value.trim();
            const ffl = document.getElementById('ffl').value.trim();
            const topc = document.getElementById('topc').value.trim();
            const pcol = document.getElementById('pcol').value.trim();
            const remarks = document.getElementById('remarks').value.trim();
            const status = document.getElementById('status').value;
            if (!serial) return alert('Please enter a Serial / No.');

            const item = { serial, zone, ffl, topc, pcol, remarks, status };
            try {
                const id = await upsertPilecap(item, editId || null);
                if (editId) {
                    dataList = dataList.map(x => x.id === editId ? {id: editId, ...item} : x);
                } else {
                    dataList.push({id, ...item});
                }
                await saveAndRefresh();
                goHome();
            } catch (err) {
                alert('Save failed: ' + err.message);
            }
        }

        function editData(id) {
            if (!roleIsAdmin()) return alert('Only Admin can edit data.');
            const item = dataList.find(d => d.id === id);
            if (item) {
                document.getElementById('editId').value = item.id;
                document.getElementById('serial').value = item.serial;
                document.getElementById('zone').value = item.zone || '';
                document.getElementById('ffl').value = item.ffl || '';
                document.getElementById('topc').value = item.topc || '';
                document.getElementById('pcol').value = item.pcol || '';
                document.getElementById('remarks').value = item.remarks || '';
                document.getElementById('status').value = item.status || 'Pending';

                document.getElementById('formTitle').innerText = "Edit or Delete Data";
                document.getElementById('deleteBtnInForm').style.display = 'block'; 
                
                document.getElementById('homeView').style.display = 'none';
                document.getElementById('formView').style.display = 'block';
                window.scrollTo(0, 0);
            }
        }

        async function deleteCurrentData() {
            if (!roleIsAdmin()) return alert('Only Admin can delete data.');
            const editId = document.getElementById('editId').value;
            if (!editId) return;
            if (!confirm('Are you sure you want to delete this data?')) return;
            try {
                await window.firebaseFns.deleteDoc(window.firebaseFns.doc(window.firebaseDB, 'pilecaps', String(editId)));
                dataList = dataList.filter(item => item.id != editId);
                await saveAndRefresh();
                goHome();
            } catch (err) {
                alert('Delete failed: ' + err.message);
            }
        }

        function clearForm() {
            document.getElementById('editId').value = '';
            document.getElementById('serial').value = '';
            document.getElementById('zone').value = '';
            document.getElementById('ffl').value = '';
            document.getElementById('topc').value = '';
            document.getElementById('pcol').value = '';
            document.getElementById('remarks').value = '';
            document.getElementById('status').value = 'Pending';
        }

        async function resetAllData() {
            if (!roleIsAdmin()) return alert('Only Admin can reset data.');
            if (!dataList.length) return alert('There is no saved data to reset.');
            if (!confirm('WARNING!\n\nAll PileCap data will be permanently deleted.\n\nContinue?')) return;
            try {
                const f = window.firebaseFns;
                const batch = f.writeBatch(window.firebaseDB);
                dataList.forEach(item => batch.delete(f.doc(window.firebaseDB, 'pilecaps', String(item.id))));
                await batch.commit();
                dataList = [];
                document.getElementById('searchInput').value = '';
                document.getElementById('searchResultCard').style.display = 'none';
                document.getElementById('searchResultCard').innerHTML = '';
                document.getElementById('resultContainer').style.display = 'none';
                updateCounters();
                clearForm();
                populateSerialDropdown();
                alert('All PileCap data has been reset successfully.');
            } catch (err) {
                alert('Reset failed: ' + err.message);
            }
        }

        async function saveAndRefresh() {
            if (!roleIsAdmin()) return alert('Only Admin can modify data.');
            updateCounters();
            updateSerialDropdown();
            populateSerialDropdown();
        }

        async function upsertPilecap(item, existingId=null) {
            if (!roleIsAdmin()) throw new Error('Only Admin can modify data.');
            const f = window.firebaseFns;
            if (existingId) {
                await f.updateDoc(f.doc(window.firebaseDB, 'pilecaps', String(existingId)), item);
                return String(existingId);
            }
            const ref = await f.addDoc(f.collection(window.firebaseDB, 'pilecaps'), item);
            return ref.id;
        }

        function populateSerialDropdown() {
            const select = document.getElementById('serialSelect');
            if (!select) return;
            const currentValue = select.value;
            const sorted = [...dataList].sort((a, b) =>
                String(a.serial || '').localeCompare(String(b.serial || ''), undefined, {numeric:true, sensitivity:'base'})
            );
            select.innerHTML = '<option value="">Select Serial / No...</option>';
            sorted.forEach(item => {
                const serial = String(item.serial || '').trim();
                if (!serial) return;
                const option = document.createElement('option');
                option.value = serial;
                option.textContent = serial;
                select.appendChild(option);
            });
            if (sorted.some(item => String(item.serial || '') === currentValue)) select.value = currentValue;
        }

        function selectSerialData(serial) {
            const searchInput = document.getElementById('searchInput');
            if (!serial) {
                searchInput.value = '';
                document.getElementById('searchResultCard').style.display = 'none';
                document.getElementById('searchResultCard').innerHTML = '';
                document.getElementById('resultContainer').style.display = 'none';
                return;
            }
            searchInput.value = serial;
            showSearchResultForSerial(serial);
        }

        function updateCounters() {
            document.getElementById('totalCount').innerText = dataList.length;
            document.getElementById('completeCount').innerText = dataList.filter(item => item.status === 'Complete').length;
            document.getElementById('pendingCount').innerText = dataList.filter(item => (item.status || 'Pending') === 'Pending').length;
            document.getElementById('processingCount').innerText = dataList.filter(item => item.status === 'Processing').length;
            document.getElementById('holdCount').innerText = dataList.filter(item => item.status === 'Hold').length;
        }

        function filterByStatus(statusType) {
            const resultContainer = document.getElementById('resultContainer');
            const searchInput = document.getElementById('searchInput');
            searchInput.value = '';
            resultContainer.style.display = 'block';
            displayData(statusType === 'All' ? dataList : dataList.filter(item => (item.status || 'Pending') === statusType));
        }

        function displayData(array) {
            applyRoleUI();
            array = [...array].sort((a, b) => String(a.serial).localeCompare(String(b.serial), undefined, {numeric:true, sensitivity:'base'}));
            const sections = [
                ['Complete','completeSection','completeTable','Complete'],
                ['Processing','processingSection','processingTable','Processing'],
                ['Hold','holdSection','holdTable','Hold'],
                ['Pending','pendingSection','pendingTable','Pending']
            ];
            const container = document.getElementById('resultContainer');
            container.innerHTML = '';

            sections.forEach(([status,id,tableId,label]) => {
                const items = array.filter(item => (item.status || 'Pending') === status);
                if (items.length === 0 && array.length > 0) return;

                const section = document.createElement('div');
                section.id = id;
                section.innerHTML = `
                    <div class="section-title" style="${status === 'Complete' ? 'color:#28a745;' : ''}">${label} List</div>
                    <div class="table-box">
                        <table>
                            <thead>
                                <tr>
                                    <th class="${status === 'Complete' ? 'complete-header' : ''}">Serial</th>
                                    <th class="${status === 'Complete' ? 'complete-header' : ''}">Zone</th>
                                    <th class="${status === 'Complete' ? 'complete-header' : ''}">FFL</th>
                                    <th class="${status === 'Complete' ? 'complete-header' : ''}">TOPC</th>
                                    <th class="${status === 'Complete' ? 'complete-header' : ''}">PCOL</th>
                                    <th class="${status === 'Complete' ? 'complete-header' : ''}">Remarks</th>
                                    <th class="${status === 'Complete' ? 'complete-header' : ''}" style="text-align: center;">Action</th>
                                </tr>
                            </thead>
                            <tbody id="${tableId}">
                                ${items.length ? items.map(item => `
                                    <tr>
                                        <td><b>${item.serial}</b></td>
                                        <td>${item.zone || '-'}</td>
                                        <td>${item.ffl || '-'}</td>
                                        <td>${item.topc || '-'}</td>
                                        <td>${item.pcol || '-'}</td>
                                        <td>${item.remarks || '-'}</td>
                                        <td style="text-align:center;">
                                            <div class="action-btns">
                                                <button class="icon-edit-btn" onclick="editData(${item.id})">Edit</button>
                                            </div>
                                        </td>
                                    </tr>
                                `).join('') : `<tr><td colspan="7" style="text-align:center;">No ${status} Data Available</td></tr>`}
                            </tbody>
                        </table>
                    </div>
                `;
                container.appendChild(section);
            });
            updateCounters();
        }


        function updateSerialDropdown() {
            const select = document.getElementById('serialSelect');
            if (!select) return;

            const current = select.value;
            const serials = [...new Set(
                dataList
                    .map(item => String(item.serial ?? '').trim())
                    .filter(Boolean)
            )].sort((a, b) =>
                a.localeCompare(b, undefined, {numeric: true, sensitivity: 'base'})
            );

            select.innerHTML = '<option value="">Select Serial / No</option>' +
                serials.map(serial =>
                    `<option value="${escapeHtml(serial)}">${escapeHtml(serial)}</option>`
                ).join('');

            if (serials.includes(current)) {
                select.value = current;
            }
        }

        function selectSerialData() {
            const select = document.getElementById('serialSelect');
            const q = select ? select.value.trim() : '';
            const searchInput = document.getElementById('searchInput');

            if (!q) {
                if (searchInput) searchInput.value = '';
                const card = document.getElementById('searchResultCard');
                const result = document.getElementById('resultContainer');
                if (card) { card.style.display = 'none'; card.innerHTML = ''; }
                if (result) result.style.display = 'none';
                return;
            }

            if (searchInput) searchInput.value = q;
            searchData();
        }

        function searchData() {
            const q = document.getElementById('searchInput').value.trim();
            const select = document.getElementById('serialSelect');
            if (!q) {
                document.getElementById('searchResultCard').style.display = 'none';
                document.getElementById('searchResultCard').innerHTML = '';
                document.getElementById('resultContainer').style.display = 'none';
                if (select) select.value = '';
                return;
            }
            if (select) {
                const match = [...select.options].find(o => o.value.toLowerCase() === q.toLowerCase());
                select.value = match ? match.value : '';
            }
            showSearchResultForSerial(q);
        }

        function showSearchResultForSerial(q) {
            const card = document.getElementById('searchResultCard');
            const result = document.getElementById('resultContainer');
            if(!q){ card.style.display='none'; card.innerHTML=''; result.style.display='none'; return; }
            const item = dataList.find(x => String(x.serial??'').trim().toLowerCase() === q.toLowerCase());
            result.style.display = 'none';
            card.style.display = 'block';

            if(!item){ 
                card.innerHTML = `<div class="search-empty">No Data Found for Serial ${escapeHtml(q)}</div>`; 
                return; 
            }

            const extras = [];
            extras.push(['SIZE', item.size || '-']);
            extras.push(['Pilecap D', item.pilecapD || '-']);
            extras.push(['SFL', item.sfl || '-']);
            extras.push(['Beam Ref', item.beamRef || '-']);
            extras.push(['Beam Depth', item.beamDepth || '-']);
            extras.push(['Status', item.status || 'Pending']);
            extras.push(['Remarks', item.remarks || '-']);
            Object.entries(item.extra||{}).forEach(([k,v]) => extras.push([k,v]));

            const iconFor = (k) => ({'SIZE':'▤','Pilecap D':'◫','SFL':'↕','Beam Ref':'▰','Beam Depth':'▤','Status':'≡','Remarks':'≡'}[k] || '•');
            const more = extras.length ? extras.map(([k,v]) => `<div class="search-result-field"><span class="search-result-icon">${iconFor(k)}</span><div class="search-result-content"><span class="search-result-label">${escapeHtml(k)}</span><span class="search-result-value">${escapeHtml(v)}</span></div></div>`).join('') : '<div class="search-empty">No additional details</div>';
            
            card.innerHTML = `
                <div class="search-result-card">
                    <div class="search-result-title">Search Result — ${escapeHtml(item.serial)}</div>
                    <div class="search-result-grid">
                        <div class="search-result-field"><span class="search-result-icon">↕</span><div class="search-result-content"><span class="search-result-label">No / Serial</span><span class="search-result-value">${escapeHtml(item.serial||'-')}</span></div></div>
                        <div class="search-result-field"><span class="search-result-icon">↕</span><div class="search-result-content"><span class="search-result-label">SFL</span><span class="search-result-value">${escapeHtml(item.sfl||'-')}</span></div></div>
                        <div class="search-result-field"><span class="search-result-icon">◫</span><div class="search-result-content"><span class="search-result-label">Pilecap D</span><span class="search-result-value">${escapeHtml(item.pilecapD||'-')}</span></div></div>
                        <div class="search-result-field"><span class="search-result-icon">↕</span><div class="search-result-content"><span class="search-result-label">FFL</span><span class="search-result-value">${escapeHtml(item.ffl||'-')}</span></div></div>
                        <div class="search-result-field"><span class="search-result-icon">◈</span><div class="search-result-content"><span class="search-result-label">TOPC</span><span class="search-result-value">${escapeHtml(item.topc||'-')}</span></div></div>
                        <div class="search-result-field"><span class="search-result-icon">▦</span><div class="search-result-content"><span class="search-result-label">PCOL</span><span class="search-result-value">${escapeHtml(item.pcol||'-')}</span></div></div>
                    </div>
                    <button type="button" class="excel-btn" style="margin-top:10px; width:100%;" onclick="toggleMoreDetails(this)">View More Columns</button>
                    <div class="more-details" style="display:none;margin-top:10px">
                        <div class="search-result-grid"><div class="search-result-field"><span class="search-result-icon">⌖</span><div class="search-result-content"><span class="search-result-label">Zone</span><span class="search-result-value">${escapeHtml(item.zone||'-')}</span></div></div>${more}</div>
                    </div>
                    <div class="search-result-actions">
                        <button class="icon-edit-btn" onclick="editData(${item.id})">✎ &nbsp;Edit</button>
                    </div>
                </div>`;
        }

        function toggleMoreDetails(btn){
            const box = btn.nextElementSibling;
            const open = box.style.display !== 'none';
            box.style.display = open ? 'none' : 'block';
            btn.textContent = open ? 'View More Columns' : 'Hide More Columns';
        }

        function escapeHtml(v){
            return String(v??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
        }

        function importFromExcel(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;
            if (typeof XLSX === 'undefined') {
                alert('Excel Import library is not loaded. Please open the app with internet access once and try again.');
                event.target.value = '';
                return;
            }
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const wb = XLSX.read(e.target.result, {type:'array', cellDates:true});
                    const ws = wb.Sheets[wb.SheetNames[0]];
                    const matrix = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
                    if (!matrix.length) throw new Error('Empty sheet');

                    const rawHeaders = matrix[0] || [];
                    const headers = rawHeaders.map((h,i) => {
                        const t = String(h ?? '').trim();
                        return t || `Column ${i+1}`;
                    });
                    const norm = v => String(v ?? '').trim().toLowerCase().replace(/[^a-z0-9]/g,'');
                    const headerNorm = headers.map(norm);
                    const findCol = names => {
                        for (const n of names) {
                            const i = headerNorm.indexOf(n);
                            if (i >= 0) return i;
                        }
                        return -1;
                    };

                    const noCol = findCol(['no','serial','serialno','serialnumber','sl','slno','sno']);
                    if (noCol < 0) throw new Error('No/Serial column not found');

                    const fflCol = findCol(['ffl']);
                    const topcCol = findCol(['topc','top','topofpilecap']);
                    const pcolCol = findCol(['pcol','col','column','pilecaplevel']);
                    const zoneCol = findCol(['zone']);
                    const sizeCol = findCol(['size']);
                    const remarksCol = findCol(['remarks','remark','notes','note']);
                    const statusCol = findCol(['status']);
                    const pilecapDCol = findCol(['pilecapd','pilecapdepth']);
                    const sflCol = findCol(['sfl']);
                    const beamRefCol = findCol(['beamref','beamreference']);
                    const beamDepthCol = findCol(['beamdepth']);

                    const get = (row, i) => i >= 0 ? row[i] : '';

                    const map = new Map(dataList.map(x => [String(x.serial||'').trim().toLowerCase(), x]));
                    let imported = 0, updated = 0;

                    for (let r = 1; r < matrix.length; r++) {
                        const row = matrix[r] || [];
                        const serial = String(get(row, noCol) ?? '').trim();
                        if (!serial) continue;

                        let status = String(get(row, statusCol) ?? '').trim();
                        const sk = status.toLowerCase();
                        status = sk==='complete' ? 'Complete' : sk==='processing'||sk==='process' ? 'Processing' : sk==='hold'||sk==='on hold' ? 'Hold' : 'Pending';

                        const extra = {};
                        headers.forEach((h, i) => {
                            if (i===noCol||i===fflCol||i===topcCol||i===pcolCol||i===zoneCol||i===sizeCol||i===pilecapDCol||i===sflCol||i===beamRefCol||i===beamDepthCol||i===remarksCol||i===statusCol) return;
                            const v = get(row, i);
                            if (String(v??'').trim() !== '') extra[h] = String(v).trim();
                        });

                        const key = serial.toLowerCase();
                        const old = map.get(key);
                        const item = {
                            id: old ? old.id : Date.now() + r,
                            serial,
                            zone: String(get(row, zoneCol) ?? '').trim(),
                            ffl: String(get(row, fflCol) ?? '').trim(),
                            topc: String(get(row, topcCol) ?? '').trim(),
                            pcol: String(get(row, pcolCol) ?? '').trim(),
                            size: String(get(row, sizeCol) ?? '').trim(),
                            pilecapD: String(get(row, pilecapDCol) ?? '').trim(),
                            sfl: String(get(row, sflCol) ?? '').trim(),
                            beamRef: String(get(row, beamRefCol) ?? '').trim(),
                            beamDepth: String(get(row, beamDepthCol) ?? '').trim(),
                            remarks: String(get(row, remarksCol) ?? '').trim(),
                            status,
                            extra
                        };
                        map.set(key, item);
                        old ? updated++ : imported++;
                    }

                    if (!roleIsAdmin()) throw new Error('Only Admin can import Excel data.');
                    const f = window.firebaseFns;
                    const batch = f.writeBatch(window.firebaseDB);
                    const finalItems = Array.from(map.values()).sort((a,b) => String(a.serial).localeCompare(String(b.serial), undefined, {numeric:true, sensitivity:'base'}));
                    finalItems.forEach(item => {
                        const ref = item.id && String(item.id).length > 10
                            ? f.doc(window.firebaseDB, 'pilecaps', String(item.id))
                            : f.doc(f.collection(window.firebaseDB, 'pilecaps'));
                        const copy = {...item};
                        delete copy.id;
                        batch.set(ref, copy, {merge:true});
                    });
                    await batch.commit();
                    await loadFirebaseData();
                    updateSerialDropdown();
                    event.target.value = '';
                    document.getElementById('searchInput').value = '';
                    document.getElementById('resultContainer').style.display = 'none';
                    document.getElementById('searchResultCard').style.display = 'none';
                    alert(`Excel Import Complete!\nNew entries: ${imported}\nUpdated entries: ${updated}\nTotal entries: ${dataList.length}`);
                } catch(err) {
                    console.error(err);
                    event.target.value = '';
                    alert('Excel Import failed. The first row must contain a No/Serial column.');
                }
            };
            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
